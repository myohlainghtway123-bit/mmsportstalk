name: Connect Real Football API Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-real-football-api-once.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect App.js to MST football backend
        run: python3 scripts/connect_real_football_api.py

      - name: Remove one-time migration files
        run: |
          rm -f .github/workflows/connect-real-football-api-once.yml
          rm -f scripts/connect_real_football_api.py

      - name: Commit integration
        run: |
          git config user.name "MST Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Connect mobile app to real MST football API"
          git push
