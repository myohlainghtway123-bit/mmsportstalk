name: Task Final Play Release Wiring

on:
  push:
    branches:
      - fix/final-play-release-wiring

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Release safety
        run: npm run test:release-language-billing
      - name: Phase 4B regression
        run: npm run test:phase4b
      - name: Production Android export
        env:
          EXPO_PUBLIC_MST_ENVIRONMENT: production
          EXPO_PUBLIC_MST_INTERNAL: "false"
          EXPO_PUBLIC_MST_SCORES_API_ORIGIN: https://scores-api.myanmarsportstalk.com
          EXPO_PUBLIC_MST_APP_API_ORIGIN: https://app-api.myanmarsportstalk.com
          EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID: ca-app-pub-3940256099942544/5224354917
          EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID: ca-app-pub-3940256099942544/6300978111
        run: node scripts/generate_assets.js && npx expo export --clear --platform android --output-dir dist-final-wiring && node scripts/validate_phase4b_bundle.js dist-final-wiring default
