name: Phase 2 Connect Once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.issue.title == 'RUN MST PHASE 2 INTEGRATION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect Phase 2 navigation
        run: python3 scripts/apply_phase2_navigation.py

      - name: Install dependencies
        run: npm ci

      - name: Verify Android Expo bundle
        run: npx expo export --platform android --output-dir /tmp/mst-phase2-check

      - name: Remove one-time integration files
        run: |
          rm -f scripts/apply_phase2_navigation.py
          rm -f .github/workflows/phase2-connect-once.yml

      - name: Commit Phase 2 integration
        run: |
          git config user.name "MST Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Connect MST account favorites and prediction system"
          git push
