name: Sync Existing Rewarded Ad to Scores

on:
  push:
    branches:
      - fix/final-play-billing-rewarded
    paths:
      - '.github/workflows/task-sync-existing-rewarded-ad.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXISTING_ANDROID_REWARDED_ID: ${{ secrets.EXPO_PUBLIC_MST_PREDICTION_ADMOB_ANDROID_REWARDED_UNIT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Validate existing rewarded secret without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "::error::EXPO_TOKEN is unavailable"; exit 2; }
          test -n "${EXISTING_ANDROID_REWARDED_ID:-}" || { echo "::error::Existing Android rewarded secret is unavailable in this repository."; exit 3; }
          [[ "$EXISTING_ANDROID_REWARDED_ID" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]] || { echo "::error::Existing Android rewarded secret has an invalid shape."; exit 4; }
          echo "Existing Android rewarded AdMob secret is present and valid."
      - name: Sync existing rewarded ID to MST Scores EAS production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@24.7.0 env:set production             --name EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID             --value "$EXISTING_ANDROID_REWARDED_ID"             --visibility plaintext             --non-interactive
          echo "Rewarded AdMob unit ID synced to MST Scores EAS production."
      - name: Verify variable name is present in EAS production without printing values
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@24.7.0 env:list production --format short --non-interactive > /tmp/mst-eas-env.txt
          grep -q '^EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID=' /tmp/mst-eas-env.txt             || grep -q 'EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID' /tmp/mst-eas-env.txt             || { echo "::error::Rewarded AdMob variable name was not found after sync."; exit 5; }
          echo "MST Scores rewarded AdMob variable is present in EAS production."
