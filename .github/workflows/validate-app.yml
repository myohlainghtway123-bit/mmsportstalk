name: Validate MST App

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/validate-app.yml'
  workflow_dispatch:

jobs:
  validate-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Install dependencies
        run: npm install

      - name: Generate MST assets
        run: npm run prepare:assets

      - name: Compile Android Expo bundle
        run: npm run validate:android
