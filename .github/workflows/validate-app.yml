name: Validate MST App

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/validate-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Compile and capture report
        id: validate
        shell: bash
        run: |
          mkdir -p .release
          : > .release/validate-report.txt
          echo "MST Android validation" >> .release/validate-report.txt
          echo "Commit: $GITHUB_SHA" >> .release/validate-report.txt
          echo "" >> .release/validate-report.txt
          set +e
          npm install >> .release/validate-report.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            npm run validate:android >> .release/validate-report.txt 2>&1
            code=$?
          fi
          echo "" >> .release/validate-report.txt
          echo "EXIT_CODE=$code" >> .release/validate-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release/validate-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update MST Android validation report"
            git push
          fi

      - name: Fail if compile failed
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1
