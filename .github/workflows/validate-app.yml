name: Validate MST App

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-app.yml'
  workflow_dispatch:

concurrency:
  group: validate-mst-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate shared backend boundary
        run: npm run validate:shared-backend

      - name: Export Android application
        run: npm run validate:android
