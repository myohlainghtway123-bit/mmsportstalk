name: Validate MST App

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-app.yml'
  workflow_dispatch:

concurrency:
  group: validate-mst-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate shared backend boundary
        run: npm run validate:shared-backend

      - name: Verify dedicated app API
        shell: bash
        run: |
          set -euo pipefail
          API_ORIGIN='https://app-api.myanmarsportstalk.com'
          health="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --max-time 15 "$API_ORIGIN/health")"
          node -e 'const p=JSON.parse(process.argv[1]); process.exit(p.service==="mst-app-api" && p.ok===true && p.upstreamStatus===200 ? 0 : 1)' "$health"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "$API_ORIGIN/api/content/articles" >/dev/null

      - name: Export Android application
        run: npm run validate:android
