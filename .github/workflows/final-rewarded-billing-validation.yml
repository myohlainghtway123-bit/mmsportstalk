name: Final Rewarded Billing Validation

on:
  push:
    branches:
      - fix/final-rewarded-billing-release

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Release safety contracts
        run: npm run test:release-language-billing
      - name: Phase 4B regression
        run: npm run test:phase4b
      - name: Shared backend boundary
        run: npm run validate:shared-backend
      - name: Production Android JS export
        env:
          EXPO_PUBLIC_MST_ENVIRONMENT: production
          EXPO_PUBLIC_MST_INTERNAL: "false"
          EXPO_PUBLIC_MST_SCORES_API_ORIGIN: https://scores-api.myanmarsportstalk.com
          EXPO_PUBLIC_MST_APP_API_ORIGIN: https://app-api.myanmarsportstalk.com
          EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID: ca-app-pub-3940256099942544/5224354917
        run: node scripts/generate_assets.js && npx expo export --clear --platform android --output-dir dist-final-check && node scripts/validate_phase4b_bundle.js dist-final-check default
