name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - phase4b-internal
          - production
  push:
    branches: [main]
    paths:
      - '.release/android-preview.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with EAS
        id: eas
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform || 'android' }}
          PROFILE: ${{ inputs.profile || 'preview' }}
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --wait 2>&1 | tee eas-build-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save build result
        if: always()
        shell: bash
        run: |
          mkdir -p .release
          {
            echo "MST FINAL ANDROID PREVIEW BUILD"
            echo "Commit: $GITHUB_SHA"
            echo "Exit code: ${{ steps.eas.outputs.exit_code }}"
            echo ""
            cat eas-build-output.txt 2>/dev/null || true
          } > .release/latest-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release/latest-build.txt
          git commit -m "Record final EAS Android build result" || true
          git push || true

      - name: Fail if EAS build failed
        if: ${{ steps.eas.outputs.exit_code != '0' }}
        run: exit 1
