name: Task Check Rewarded Ad Env

on:
  push:
    branches:
      - fix/final-play-billing-rewarded
    paths:
      - '.github/workflows/task-check-rewarded-env.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Verify EAS production rewarded unit exists without printing it
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "::error::EXPO_TOKEN is unavailable"; exit 2; }
          npx --yes eas-cli@24.7.0 env:get production             --variable-name EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID             --format short             --non-interactive > /tmp/mst-rewarded-id.txt 2>/tmp/mst-rewarded-err.txt
          test -s /tmp/mst-rewarded-id.txt || { echo "::error::Android rewarded AdMob unit ID is missing from EAS production."; exit 3; }
          if ! grep -Eq 'ca-app-pub-[0-9]+/[0-9]+' /tmp/mst-rewarded-id.txt; then
            echo "::error::Android rewarded AdMob unit ID does not have the expected shape."
            exit 4
          fi
          echo "Android rewarded AdMob unit ID is configured in EAS production."
