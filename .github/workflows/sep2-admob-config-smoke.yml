name: Sep 2 AdMob Config Smoke

on:
  push:
    branches:
      - main
      - chatgpt/sep2-expo-auth-smoke-2026-09-02
    paths:
      - .github/workflows/sep2-admob-config-smoke.yml
      - app.config.js
      - src/phase4b/Phase4BAdBanner.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admob-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MST_ADMOB_ANDROID_APP_ID: ${{ secrets.MST_ADMOB_ANDROID_APP_ID }}
      MST_ADMOB_IOS_APP_ID: ${{ secrets.MST_ADMOB_IOS_APP_ID }}
      EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID }}
      EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release AdMob values exist without printing them
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            MST_ADMOB_ANDROID_APP_ID \
            MST_ADMOB_IOS_APP_ID \
            EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID \
            EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for this repository."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 2

      - name: Validate AdMob identifier shapes without logging values
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MST_ADMOB_ANDROID_APP_ID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]] || { echo "::error::Android AdMob App ID has an invalid shape."; exit 2; }
          [[ "$MST_ADMOB_IOS_APP_ID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]] || { echo "::error::iOS AdMob App ID has an invalid shape."; exit 2; }
          [[ "$EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]] || { echo "::error::Android banner unit ID has an invalid shape."; exit 2; }
          [[ "$EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]] || { echo "::error::iOS banner unit ID has an invalid shape."; exit 2; }
          echo "AdMob release configuration smoke passed; no ad request or build was started."

      - name: Generate secure env artifact and sync to EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MST_ADMOB_ANDROID_APP_ID: ${{ secrets.MST_ADMOB_ANDROID_APP_ID }}
          MST_ADMOB_IOS_APP_ID: ${{ secrets.MST_ADMOB_IOS_APP_ID }}
          EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secure-env
          {
            echo "MST_ADMOB_ANDROID_APP_ID=$MST_ADMOB_ANDROID_APP_ID"
            echo "MST_ADMOB_IOS_APP_ID=$MST_ADMOB_IOS_APP_ID"
            echo "EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID=$EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID"
            echo "EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID=$EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID"
            echo "EXPO_PUBLIC_MST_ENVIRONMENT=production"
            echo "EXPO_PUBLIC_MST_SCORES_API_ORIGIN=https://scores-api.myanmarsportstalk.com"
            echo "EXPO_PUBLIC_MST_APP_API_ORIGIN=https://app-api.myanmarsportstalk.com"
          } > secure-env/.env.production.local

          npx --yes eas-cli@24.7.0 env:set production --name MST_ADMOB_ANDROID_APP_ID --value "$MST_ADMOB_ANDROID_APP_ID" --visibility secret --non-interactive
          npx --yes eas-cli@24.7.0 env:set production --name MST_ADMOB_IOS_APP_ID --value "$MST_ADMOB_IOS_APP_ID" --visibility secret --non-interactive
          npx --yes eas-cli@24.7.0 env:set production --name EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID --value "$EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID" --visibility plaintext --non-interactive
          npx --yes eas-cli@24.7.0 env:set production --name EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID --value "$EXPO_PUBLIC_MST_ADMOB_IOS_BANNER_UNIT_ID" --visibility plaintext --non-interactive
          echo "AdMob release credentials synced to EAS successfully."

      - name: Upload production env artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-admob-env
          path: secure-env/.env.production.local
          retention-days: 1
