name: MST Red Restore Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mst-red-compact-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore red MST UI and compact live scores
        run: python3 scripts/restore_mst_red_compact.py

      - name: Remove migration files
        run: |
          rm -f .github/workflows/mst-red-compact-once.yml
          rm -f scripts/restore_mst_red_compact.py
          rm -f scripts/apply_mst_brand_refresh.py

      - name: Commit restored MST app
        run: |
          git config user.name "MST Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore MST red theme and compact five-match live scores"
          git push
