name: Final Release Readiness Check

on:
  push:
    branches:
      - validate/final-release-readiness-2026-09-22

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Release language billing rewarded safety
        run: npm run test:release-language-billing
      - name: Phase 4B regression
        run: npm run test:phase4b
      - name: Production Android JS export
        env:
          EXPO_PUBLIC_MST_ENVIRONMENT: production
          EXPO_PUBLIC_MST_INTERNAL: "false"
          EXPO_PUBLIC_MST_SCORES_API_ORIGIN: https://scores-api.myanmarsportstalk.com
          EXPO_PUBLIC_MST_APP_API_ORIGIN: https://app-api.myanmarsportstalk.com
        run: node scripts/generate_assets.js && npx expo export --clear --platform android --output-dir dist-final && node scripts/validate_phase4b_bundle.js dist-final default
