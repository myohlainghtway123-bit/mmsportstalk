name: Connect Full Football Data Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-full-football-data-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply full football integration
        run: python3 scripts/connect_full_football_data.py

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo bundle
        run: npx expo export --platform android --output-dir /tmp/mst-expo-check

      - name: Remove one-time migration files
        run: |
          rm -f .github/workflows/connect-full-football-data-once.yml
          rm -f scripts/connect_full_football_data.py

      - name: Commit integration
        run: |
          git config user.name "MST Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Connect full website football data to mobile app"
          git push
