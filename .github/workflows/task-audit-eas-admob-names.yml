name: Audit EAS AdMob Variable Names

on:
  push:
    branches:
      - fix/final-play-billing-rewarded
    paths:
      - '.github/workflows/task-audit-eas-admob-names.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Audit rewarded variable names without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "::error::EXPO_TOKEN is unavailable"; exit 2; }
          npx --yes eas-cli@24.7.0 env:list production --format short > /tmp/eas-prod.txt
          if grep -q 'EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID' /tmp/eas-prod.txt; then
            echo "scores_rewarded_name=present"
          else
            echo "scores_rewarded_name=absent"
          fi
          if grep -q 'EXPO_PUBLIC_MST_PREDICTION_ADMOB_ANDROID_REWARDED_UNIT_ID' /tmp/eas-prod.txt; then
            echo "prediction_rewarded_name=present"
          else
            echo "prediction_rewarded_name=absent"
          fi
          if grep -q 'EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID' /tmp/eas-prod.txt; then
            echo "scores_banner_name=present"
          else
            echo "scores_banner_name=absent"
          fi
