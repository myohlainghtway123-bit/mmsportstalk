name: Sep 2 Production Scores Origin Smoke

on:
  push:
    branches:
      - chatgpt/sep2-expo-auth-smoke-2026-09-02
    paths:
      - .github/workflows/sep2-prod-scores-origin-smoke.yml
      - eas.json
      - src/phase4b/scoresStagingApi.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-scores-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify configured production Scores API candidate
        shell: bash
        run: |
          set -euo pipefail
          origin="$(node -e 'const e=require("./eas.json"); process.stdout.write(String(e?.build?.production?.env?.EXPO_PUBLIC_MST_SCORES_API_ORIGIN || "").trim())')"
          if [ -z "$origin" ]; then
            echo "::error::No verified production Scores API origin is configured."
            exit 2
          fi
          case "$origin" in
            https://*) ;;
            *) echo "::error::Production Scores API origin must use HTTPS."; exit 2 ;;
          esac
          case "${origin,,}" in
            *staging*) echo "::error::Production Scores API origin cannot point to staging."; exit 2 ;;
          esac
          health="$(curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 15 "$origin/health")"
          node -e 'const p=JSON.parse(process.argv[1]); process.exit(p.service==="mst-scores-api" && p.environment==="production" && p.ok===true ? 0 : 1)' "$health"
          fixtures="$(curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --max-time 20 "$origin/v1/fixtures?limit=1")"
          node -e 'const p=JSON.parse(process.argv[1]); process.exit(p.ok===true && Array.isArray(p.data) ? 0 : 1)' "$fixtures"
          echo "Verified configured production Scores API origin."
