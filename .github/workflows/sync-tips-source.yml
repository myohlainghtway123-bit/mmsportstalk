name: One-time MST Tips source sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-tips-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Tips screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/final
          cat .sync_chunks/TipsScreen/part* > src/final/TipsScreen.js
          test "$(wc -c < src/final/TipsScreen.js | tr -d ' ')" -eq 52200
          grep -q 'export default function TipsScreen' src/final/TipsScreen.js

      - name: Commit current source and clean staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/final/TipsScreen.js
          git rm -r .sync_chunks/TipsScreen
          git rm .github/workflows/sync-tips-source.yml
          git commit -m "Restore full MST Tips marketplace screen"
          git push
