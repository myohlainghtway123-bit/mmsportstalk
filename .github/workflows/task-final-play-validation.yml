name: Final Play Release Validation

on:
  push:
    branches:
      - fix/final-play-billing-rewarded
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'app.config.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/task-final-play-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_MST_ENVIRONMENT: production
      EXPO_PUBLIC_MST_INTERNAL: "false"
      EXPO_PUBLIC_MST_SCORES_API_ORIGIN: https://scores-api.myanmarsportstalk.com
      EXPO_PUBLIC_MST_APP_API_ORIGIN: https://app-api.myanmarsportstalk.com
      MST_ADMOB_ANDROID_APP_ID: ca-app-pub-4446937986150717~8877382465
      EXPO_PUBLIC_MST_ADMOB_ANDROID_BANNER_UNIT_ID: ca-app-pub-3940256099942544/9214589741
      EXPO_PUBLIC_MST_ADMOB_ANDROID_REWARDED_UNIT_ID: ca-app-pub-3940256099942544/5224354917
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: npm ci
      - name: Release safety contracts
        run: npm run test:release-language-billing
      - name: Phase 4B regression
        run: npm run test:phase4b
      - name: Validate product separation
        run: npm run validate:shared-backend
      - name: Validate production Expo config
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > /tmp/expo-config.json
          node - <<'NODE'
          const c=require('/tmp/expo-config.json');
          if(c.android?.package!=='com.myanmarsportstalk.mst') throw new Error('wrong Android package');
          const plugins=c.plugins||[];
          const names=plugins.map(p=>Array.isArray(p)?p[0]:p);
          if(!names.includes('react-native-iap')) throw new Error('react-native-iap plugin missing');
          if(!names.includes('expo-build-properties')) throw new Error('expo-build-properties missing');
          if(!names.includes('react-native-google-mobile-ads')) throw new Error('AdMob plugin missing');
          NODE
      - name: Export production Android JS
        run: node scripts/generate_assets.js && npx expo export --clear --platform android --output-dir dist-final-check && node scripts/validate_phase4b_bundle.js dist-final-check default
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Compile Android release native code
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --stacktrace
