name: MST Score validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mst-score-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 22.18
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate shared backend boundary
        run: npm run validate:shared-backend

      - name: Export Android application
        run: npm run validate:android
